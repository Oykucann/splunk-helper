# Copy to environments/<name>.toml (gitignored) and fill in.
name = "example"

# VIPs (keepalived / haproxy). Never connected to; always use node addresses.
vips = ["10.0.1.100"]

[defaults]
# ssh_user = "oyku"            # omit to use ~/.ssh/config
# ssh_auth = "password"        # default "key"; "password" = ssh asks per server
# ssh_key = "~/.ssh/lab.pem"
run_as = "splunk"              # sudo -n -u <run_as>; "" if ssh_user is already the splunk user
splunk_home = "/data/splunk"
ssh_options = ["-o", "ConnectTimeout=10"]
timeout_seconds = 900

[[servers]]
name = "sh01"
host = "10.0.1.10"
role = "sh"                    # sh, cm, ds, deployer, idx, hf, uf
site = "site1"
# also_roles = ["cm"]          # lab: this SH is also the cluster manager

[[servers]]
name = "ds01"
host = "10.0.1.11"
role = "ds"
site = "site1"

[[servers]]
name = "hf01a"
host = "10.0.1.21"
role = "hf"
site = "site1"
ha_group = "site1-syslog"      # keepalived pair: collected last, one node at a time

[[servers]]
name = "hf01b"
host = "10.0.1.22"
role = "hf"
site = "site1"
ha_group = "site1-syslog"

[[servers]]
name = "uf01"                  # universal forwarder: no bundled Python, host python3 is used
host = "10.0.1.50"
role = "uf"
site = "site1"
splunk_home = "/opt/splunkforwarder"
run_as = "splunkfwd"           # UF 9.1+ default user
