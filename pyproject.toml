[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-helper"
version = "0.1.0"
description = "Read-only discovery and cleanup planning for Splunk environments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shx-collect = "shx.collect.cli:main"
shx-compare = "shx.inventory.cli:main"
shx-findings = "shx.rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shx = ["knowledge/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
